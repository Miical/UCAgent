# Curated menu entries, displayed in file order. Execution lives in workflow YAML.
workflows:
  - id: import-targets
    name: 导入验证目标
    description: 读取已有验证文档与源码，生成中文验证目标卡片并核对源码绑定，不运行仿真。
    workflow: flowcanvas:import-targets
    enabled: true
  - id: plan-goals
    name: 规划并实现验证目标
    description: 先完成 Picker 编译与加载验收，再执行 UCAgent 的需求规划、设计理解、测试点定义、边界细化和覆盖模型实现。
    workflow: flowcanvas:plan-goals
    enabled: true
  - id: picker-compile
    name: Picker 编译 RTL
    description: 用 Picker 将指定 RTL 编译为 Python DUT 包，检查加载并保存到项目 verification/<模块名>/，供后续验证使用。
    workflow: flowcanvas:picker-compile
    enabled: true
  - id: generate-testcase
    name: 新增测试用例
    description: 复用现有接口，边写用例边补齐所需验证环境，核对覆盖关联并登记源码绑定
    workflow: flowcanvas:generate-testcase
    enabled: true
  - id: rtl-summary
    name: RTL 功能简述
    description: 分析 RTL 的模块职责、接口与关键行为，生成简洁的功能说明并保存到项目输出目录。默认分析项目顶层模块。
    workflow: flowcanvas:rtl-summary
    enabled: true
  - id: default
    name: UCAgent 默认验证流程
    description: 遵循 UCAgent 原始完整验证流程，在面板维护验证目标与测试用例，并验收与最终源码的绑定一致性。需先编译 DUT。
    workflow: flowcanvas:default
    enabled: true
