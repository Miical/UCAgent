<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UCAgent FlowCanvas</title>
  <link rel="icon" href="/static/share/ucagent-favicon.svg">
  <link rel="stylesheet" href="/static/share/ucagent-shell.css">
  <link rel="stylesheet" href="/assets/app.css">
  <script src="/static/share/ucagent-shell.js"></script>
  <script>
    try {
      const theme=localStorage.getItem('flowcanvas.theme');
      UCAgentShell.applyTheme(UCAgentShell.themes[theme]?theme:'light', false);
    } catch (_) { UCAgentShell.applyTheme('light', false); }
  </script>
</head>
<body>
  <nav class="activity-bar" aria-label="主导航">
    <a class="brand-home" href="/" aria-label="返回初始页面" title="返回初始页面"><span class="uc-shell-brand-mark" aria-hidden="true">UC</span></a>
    <div class="project-navigation" aria-label="页面导航">
      <button class="nav-button active" data-view="设计总览" aria-label="设计总览" aria-current="page" aria-controls="project-content" title="设计总览"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="3" width="8" height="6" rx="1.5"/><path d="M12 9v4M5 16v-3h14v3"/><rect x="2" y="16" width="6" height="5" rx="1.5"/><rect x="16" y="16" width="6" height="5" rx="1.5"/></svg><span>设计总览</span></button>
      <button class="nav-button" data-view="验证目标" aria-label="验证目标" aria-controls="project-content" title="验证目标"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3"/></svg><span>验证目标</span></button>
      <button class="nav-button" data-view="测试用例" aria-label="测试用例" aria-controls="project-content" title="测试用例"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="15" height="17" rx="2"/><path d="M9 4V2h7v2M9 10l2 2 4-4M9 16h7"/></svg><span>测试用例</span></button>
      <button class="nav-button" data-view="Bug 管理" aria-label="Bug 管理" aria-controls="project-content" title="Bug 管理"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="13" rx="5"/><path d="M9 7V5a3 3 0 0 1 6 0v2M3 9l4 2m10 0 4-2M3 15h4m10 0h4M4 21l4-3m8 0 4 3M12 8v12"/></svg><span>Bug 管理</span></button>
    </div>
    <div class="nav-bottom">
      <button class="nav-button" id="project-open" aria-label="打开项目" title="打开项目"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Zm0 2h18"/></svg></button>
      <button class="nav-button" id="settings-toggle" aria-label="设置" title="设置与主题" aria-expanded="false" aria-controls="settings-panel">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 3-.6 2.3-2 .9L4.2 5.5 2 9.3l1.8 1.6v2.2L2 14.7l2.2 3.8 2.2-.7 2 .9L9 21h6l.6-2.3 2-.9 2.2.7 2.2-3.8-1.8-1.6v-2.2L22 9.3l-2.2-3.8-2.2.7-2-.9L15 3Z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
  </nav>
  <main class="workspace" aria-label="工作台">
    <section class="pane project-pane" aria-labelledby="project-heading">
      <header class="pane-header project-header"><span class="project-brand" aria-label="UCAgent FlowCanvas">UC<span class="brand-accent">Agent</span> FlowCanvas</span><h2 id="project-heading">设计总览</h2></header>
      <div class="pane-body" id="project-content" role="region" aria-label="设计总览内容"></div>
    </section>
    <div class="splitter" role="separator" tabindex="0" aria-label="调整项目与对话宽度" aria-orientation="vertical" aria-valuemin="18" aria-valuemax="45" aria-valuenow="25" data-split="0"></div>
    <section class="pane chat-pane" aria-label="对话">
      <header class="pane-header conversation-header">
        <div class="model-picker session-picker">
          <button id="session-toggle" class="model-trigger session-trigger" aria-label="切换对话" aria-haspopup="dialog" aria-expanded="false" aria-controls="session-popover"><span id="session-label">新对话</span><svg class="picker-chevron" viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg></button>
          <section id="session-popover" class="model-popover session-popover" role="dialog" aria-label="选择对话" hidden>
            <div class="picker-heading">对话</div>
            <input id="session-search" class="session-search" type="search" placeholder="搜索对话…" aria-label="搜索对话">
            <div class="session-tools"><button id="show-archived" type="button" aria-pressed="false">已归档</button><button id="export-chat" type="button">导出对话</button><button id="fold-steps" type="button">收起执行详情</button></div>
            <div id="session-options" class="model-options" role="group" aria-label="已有对话"></div>
          </section>
          <select id="sessions" hidden aria-label="当前对话"></select>
        </div>
        <div class="conversation-tools" role="group" aria-label="对话操作"><button class="icon-button" id="new-chat" aria-label="新建对话" title="新建对话"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
          <button id="detail-toggle" class="icon-button detail-toggle" type="button" aria-label="收起右侧栏" title="收起右侧栏" aria-expanded="true" aria-controls="detail-content"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M15 4v16"/><path class="sidebar-fill" d="M15 5h3a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-3Z"/></svg></button>
        </div>
      </header>
      <div id="connection" role="status" hidden></div>
      <section id="workflow-run" class="workflow-run" aria-label="工作流运行" hidden></section>
      <div class="pane-body conversation" id="conversation" aria-label="对话内容"><div class="chat-welcome"><div class="welcome-mark">✦</div><h3>从一个想法开始</h3><p>与助手一起梳理你的验证思路</p></div></div>
      <div id="reconnect-notice" class="reconnect-notice" role="status" hidden>连接中断，正在自动重连；回复会在连接恢复后同步。</div>
      <div id="chat-error" class="chat-error" role="alert" hidden></div>
      <div id="message-queue" class="message-queue" hidden></div>
      <div class="composer">
        <div id="quote-draft" class="annotation-tray" hidden>
          <button id="quote-toggle" type="button" aria-expanded="false">批注</button><button id="remove-quote" type="button" aria-label="移除全部批注">×</button>
          <section id="quote-panel" class="annotation-panel" aria-label="批注列表" hidden></section>
        </div>
        <textarea id="message" aria-label="消息输入" placeholder="有问题，尽管问" rows="2" maxlength="64000"></textarea>
        <div class="composer-footer">
          <div class="composer-selectors composer-left">
          <div class="model-picker">
            <button id="attach-toggle" class="model-trigger attach-trigger" aria-label="添加工作流" aria-haspopup="dialog" aria-expanded="false" aria-controls="attach-popover"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg></button>
            <section id="attach-popover" class="model-popover" role="dialog" aria-label="添加工作流" hidden><div class="picker-heading">工作流</div><div id="workflow-options" class="model-options"><p class="session-empty">加载中…</p></div></section>
          </div>
          <div class="model-picker">
            <button id="permission-toggle" class="model-trigger" aria-haspopup="dialog" aria-expanded="false" aria-controls="permission-popover"><span id="permission-label">工作流执行</span><svg class="picker-chevron" viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg></button>
            <section id="permission-popover" class="model-popover" role="dialog" aria-label="权限模式" hidden>
              <div class="picker-heading">权限模式</div>
              <div id="permission-options" class="model-options" role="group" aria-label="权限模式"></div>
            </section>
          </div>
          <div id="attached-workflows" class="attached-workflows" aria-label="已附加工作流"></div>
          </div>
          <div class="composer-selectors composer-right">
          <div class="model-picker">
            <button id="backend-toggle" class="model-trigger" aria-label="选择后端" aria-haspopup="dialog" aria-expanded="false" aria-controls="backend-popover"><span id="backend-label">Codex</span><svg class="picker-chevron" viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg></button>
            <section id="backend-popover" class="model-popover backend-popover" role="dialog" aria-label="选择后端" hidden>
              <div class="picker-heading">选择后端</div>
              <div class="model-options" role="group" aria-label="可用后端">
                <button id="backend-codex" class="model-option" aria-pressed="true"><span>Codex</span><span class="model-check">✓</span></button>
                <button class="model-option" disabled><span>OpenCode</span><span class="backend-unavailable">尚未接入</span></button>
                <button class="model-option" disabled><span>LangChain</span><span class="backend-unavailable">尚未接入</span></button>
              </div>
            </section>
          </div>
          <div class="model-picker">
            <button id="model-toggle" class="model-trigger" aria-haspopup="dialog" aria-expanded="false" aria-controls="model-popover" disabled><span id="model-label">连接中…</span><span id="model-effort-badge" class="model-effort-badge" hidden></span><span id="model-speed-badge" class="model-speed-badge" hidden></span><svg class="picker-chevron" viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg></button>
            <section id="model-popover" class="model-popover" role="dialog" aria-label="选择模型" hidden>
              <div class="picker-heading">选择模型 <span>Codex</span></div>
              <div id="model-options" class="model-options" role="group" aria-label="可用模型"></div>
              <div class="model-effort-section">
                <div class="picker-heading">推理强度</div><div id="effort-options" class="effort-options" role="group" aria-label="推理强度"></div>
              </div>
              <div class="model-speed-section">
                <div class="picker-heading">响应速度</div><div id="speed-options" role="group" aria-label="速度档位"></div>
                <p class="speed-note">加速档位会增加用量消耗，Ultrafast 消耗更高。</p>
              </div>
            </section>
            <select id="model" aria-label="模型" hidden></select><select id="effort" aria-label="推理强度" hidden></select>
          </div>

          <button id="send" class="send-button" disabled aria-label="发送消息" title="发送消息">↑</button>
          </div>
        </div>
      </div>

    </section>
    <div class="splitter" role="separator" tabindex="0" aria-label="调整对话与详情宽度" aria-orientation="vertical" aria-valuemin="40" aria-valuemax="80" aria-valuenow="70" data-split="1"></div>
    <section class="pane detail-pane" aria-label="详情区域">
      <header class="pane-header workflow-detail-header"><nav class="detail-page-tabs" aria-label="详情页面"><button type="button" id="workflow-page-tab" class="detail-page-tab active" aria-current="page">工作流</button><button id="output-page-tab" type="button" class="detail-page-tab">输出</button></nav></header>
      <div class="workflow-task-heading">
        <div class="model-picker workflow-picker">
          <button id="workflow-toggle" class="model-trigger session-trigger" aria-label="选择工作流" aria-haspopup="dialog" aria-expanded="false" aria-controls="workflow-popover"><span id="workflow-detail-ring" class="run-ring" style="--progress:0%" aria-label="工作流进度"></span><span class="workflow-task-text"><span id="workflow-label">工作流</span><span id="workflow-detail-status" class="workflow-task-status">选择一个工作流任务</span></span><svg class="picker-chevron" viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg></button>
          <section id="workflow-popover" popover="manual" class="model-popover session-popover" role="dialog" aria-label="选择工作流" hidden>
            <div class="picker-heading">工作流任务</div>
            <input id="workflow-search" class="session-search" type="search" placeholder="搜索工作流…" aria-label="搜索工作流">
            <div id="workflow-history-options" class="model-options" role="group" aria-label="工作流任务列表"></div>
          </section>
        </div>
      </div>
      <section id="test-output-panel" class="pane-body test-output-panel" hidden></section>
      <div class="pane-body" id="detail-content"><p class="workflow-detail-empty">点击顶部任务胶囊，查看工作流详情</p></div>
    </section>
  </main>
  <section class="settings-panel" id="settings-panel" aria-label="外观设置" hidden>
    <div class="settings-brand">UC<span class="brand-accent">Agent</span> FlowCanvas</div>
    <p>外观</p><div id="theme-actions"></div>
  </section>
  <dialog id="project-dialog" class="project-dialog">
    <header><h2 id="project-dialog-title">打开项目</h2><button id="project-close" class="icon-button" aria-label="关闭">×</button></header>
    <p id="project-dialog-hint">选择工作台所在机器上的项目文件夹</p>
    <div id="project-actions"><button id="project-new">新建项目</button><button id="project-without">不打开项目，直接对话</button></div>
    <div id="project-browse">
      <form id="project-path-form"><div class="project-path-input"><input id="project-path" aria-label="文件夹路径" placeholder="输入文件夹路径" autocomplete="off" spellcheck="false" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="project-path-suggestions"><div id="project-path-suggestions" role="listbox" aria-label="匹配文件夹" hidden></div></div><button>前往</button></form>
      <h3 class="project-recents-heading">最近打开的项目</h3>
      <div id="project-recents" aria-label="最近打开的项目"></div>
    </div>
    <div id="project-import" hidden><label for="project-name">项目名称</label><input id="project-name" maxlength="120"><p id="project-import-path"></p>
      <div id="project-rtl-import">
        <label for="project-top">顶层模块</label>
        <input id="project-top" autocomplete="off" spellcheck="false" placeholder="输入模块名称或源码路径筛选" role="combobox" aria-autocomplete="list" aria-controls="project-module-options" aria-expanded="false">
        <div id="project-module-options" role="listbox" aria-label="顶层模块候选" hidden></div>
        <p id="project-rtl-status" role="status"></p>
        <div id="project-filelist" aria-label="依赖文件清单"></div>
      </div><p>将在所选目录创建 <code>.flowcanvas/project.json</code>，保存项目标识与名称。</p></div>
    <p id="project-error" role="alert" hidden></p>
    <footer><button id="project-back" hidden>重新选择</button><button id="project-confirm">选择此文件夹</button></footer>
  </dialog>
  <script src="/assets/app.js"></script>
  <script src="/assets/projects.js"></script>
  <script src="/assets/rtl-viewer.js"></script>
  <script src="/assets/targets.js"></script>
<script src="/assets/test-output.js"></script>
  <script type="module" src="/assets/chat.js"></script>
</body>
</html>
