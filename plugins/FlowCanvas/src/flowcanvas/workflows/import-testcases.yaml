# Synchronize existing tests and reuse current isolated coverage-smoke evidence.
template: null
guide_doc:
  enable: false
skill:
  use_skill: false
  general_skill_list: []
mission:
  name: 同步测试用例
  prompt:
    system: |
      Synchronize existing tests from project {PROJECT_ROOT}, scoped to DUT {DUT}, into FlowCanvas.
      This workflow is repeatable. Inspect existing cases before allocating IDs. Match runnable entry,
      configuration/selector and stable source bindings; titles alone are not identity. Add only missing
      cases. Reuse existing IDs, history and dedicated conversations. Unchanged healthy cases are
      read-only: never begin_modify, rename, rewrite descriptions/overview/timeline, rebind sources,
      regenerate markers or reconfigure runners merely because synchronization ran again.
      Repair only actual source/configuration changes or concrete errors, using the smallest update.
      Preserve all unaffected fields and record each existing-case repair in case-import.json repairs
      as {id,reason} with actual source/configuration evidence. Do not automatically delete old cases
      or modify transactions owned by other conversations; report unresolved entries instead.
      Inspect and reuse valid shared coverage/build/mapping configuration without rewriting it.
      Reuse an existing current completed coverage-smoke receipt without launching a new run. Find
      previous smoke/reference IDs and receipts in managed output/flowcanvas/test-runs metadata.
      Only a missing or stale receipt requires one complete smoke; a no-change sync is read-only.
      Read documentation, test sources and actual build/run configuration. UVM configurations using
      one base test with different sequences may be separate cases; do not register environment-only
      base classes. Python cases use explicit pytest entries. Select existing runnable scenarios.
      Write concise Chinese titles/descriptions based on documentation and verified against source;
      without documentation derive them from real stimulus and checks. Do not invent passing results.
      Use test_cases inspect/apply/begin_modify/update/end_modify. Reuse existing IDs; each card needs
      name, title, description, its own runner={command,description}, and definition line bindings.
      Keep project build flow and required dependencies. All generated build outputs go under output/flowcanvas/build; reuse existing compiled inputs without moving them. Place each run's outputs under {run_dir}, expanded by the platform to output/flowcanvas/test-runs/<run_id>.
      Configure one waveform directly at {wave_dir}/waves.vcd; the platform precreates {wave_dir}
      as {run_dir}/waveforms for each execution. Forward that path to the real simulator/fixture,
      explicitly enable the real waveform switch (including any wrapper default that disables dumping), select the DUT hierarchy, enable VCD dumping and prepare required compile/debug options. Creating a directory or passing
      an unused option is insufficient. Do not add intermediate VPD files or conversion steps.
      The waveform page opens the primary file automatically. Preserve simulation exit status and
      report missing output; never reuse an earlier run's waveform or fabricate one.
      Do not rewrite DUT or test behavior to make startup pass. Correct entry commands or configuration
      only when evidence supports it. Bind only code that directly defines this case's scenario: the runnable test entry as definition
      and the concrete sequence or virtual sequence that supplies this case's stimulus as stimulus.
      Include a case-specific constraint, helper task or expected-result check only when indispensable
      to understanding what distinguishes this case. Bind the smallest complete logical fragment.
      Reading a dependency to understand execution does not mean attaching it to the case.
      Do not recursively bind the call graph or fill every binding role. Shared monitors, drivers,
      sequencers, agents, environments, base tests, generic scoreboards, coverage collectors, fixtures,
      RTL and build/run scripts are not case bindings merely because the test uses them. An exception
      must identify indispensable case-specific behavior and be justified in the import notes; never
      attach an entire shared component for a small case-specific branch. Synchronization preserves unchanged bindings. Only an evidenced incorrect or overly broad
      binding may be repaired and recorded in repairs; do not routinely replace existing bindings. Do not delete source or change unrelated cases.
      Only when no valid smoke exists, create or repair one dedicated short smoke case using an imported case's existing build, runner, fixtures
      and coverage instrumentation. Run that smoke to natural completion and validate actual line
      and functional coverage extraction. Do not run the whole imported suite. Smoke uses a private
      database and never publishes cumulative coverage; it proves the selected execution path only.
      Save scope and receipts in {OUT}/case-import.json, never edit card management files directly.
      Use SetCurrentStageJournal and Complete through all stages, then Exit after acceptance.

      If inspection finds no eligible source content, do not stop, invent cards, generate a new
      verification environment, or fabricate coverage/smoke receipts. Write an explicit absence
      result in the phase's scope JSON: status: skipped, skip_reason: a concrete source-backed
      explanation, inspected_files: nonempty existing project-relative source paths actually read
      (RTL paths are valid evidence when no verification source exists), files: [], card_ids: [],
      repairs: []. Preserve every existing card and all runs unchanged. Use this same scope result
      to Complete each remaining stage of this phase; its checkers accept an evidenced skip.
      Continue into the next phase in a combined import; do not Exit between phases. Report skipped
      phases and their reasons separately from successfully synchronized content. Missing tools,
      broken dependencies, unreadable source, malformed coverage and failed simulation are errors,
      never absence evidence. If eligible definitions or runnable cases exist, normal acceptance
      remains mandatory. Missing coverage definitions alone must not skip available test cases.
      When runnable cases exist but no eligible functional coverage definitions or existing target
      cards exist, import the cases and real waveform-enabled runners normally. Record in
      case-import.json coverage_status: skipped, coverage_skip_reason: the concrete absence reason,
      coverage_inspected_files: nonempty existing project-relative inspected sources. Complete the
      shared coverage and coverage-smoke gates with that evidence, without generating a coverage
      model or running a fake smoke. This does not skip card/runner validation or claim a passing
      simulation. Existing coverage definitions or targets require normal configuration and smoke;
      unavailable tools, failed extraction and invalid coverage mappings cannot use this skip.
    tips:
      always: []
      random: []
tools:
  selected_tools: [ReadTextFile, EditTextFile, CurrentTips, Status, SetCurrentStageJournal, Complete, Exit]
write_dirs: ["{OUT}"]
stage:
  - name: inspect_testcase_scope
    desc: 确认测试用例与运行入口
    task:
      - "If no existing runnable test scenarios exist, record the explicit skipped scope described in the system policy and Complete every remaining case stage without creating cases, configuring coverage or running smoke."
      - "Read actual test entrypoints, scripts and test configuration. Select runnable scenarios in the requested module and exclude unrelated suites and base classes."
      - "Write {OUT}/case-import.json with files (project-relative test implementation files), card_ids=[], repairs=[]. Record concise scope/exclusion notes as needed. Track all reused, added and repaired case IDs."
    checker:
      - name: scope
        clss: flowcanvas.case_import_workflow.CaseImportChecker
        args: {mode: scope}
  - name: import_testcases
    desc: 同步测试用例
    task:
      - "Reuse unchanged source-backed cards without writes; add missing cards and repair only evidenced issues, then inspect shared coverage through the three child stages. Keep card modifications open until each card has its runner; never invent a placeholder command to finish a card early."
    stage:
      - name: import_testcase_cards
        desc: 创建卡片并绑定源码
        task:
          - "Inspect existing cards, reuse matching entries, and apply only the needed new IDs. Do not begin modifications on unchanged cards; begin modifications only for added or justified repaired cards. Fill readable Chinese title/description, actual entry name and focused line-range bindings for the entry and concrete scenario sequence. Preserve valid existing bindings; repair infrastructure-only attachments only as a documented issue. Leave new cards in creating/updating state until the next child stage configures their runners."
          - "Choose the existing project script's test selector as name for UVM configuration-driven tests. Python name is test_function or TestClass::test_method."
          - "Record all imported/reused IDs in card_ids. Do not add placeholder commands or finish incomplete cards merely to pass this stage."
        checker:
          - name: cards
            clss: flowcanvas.case_import_workflow.CaseImportChecker
            args: {mode: cards}
      - name: configure_testcase_runners
        desc: 配置运行命令
        task:
          - "Inspect each card's runner={command,description}; preserve valid unchanged runners exactly. Configure only missing or evidenced broken/outdated runners from actual project scripts and dependencies. Continue its existing modification or begin_modify if necessary; then end_modify after configuring a real runnable entry."
          - "The runner expands {case} once and shell-quotes it; do not prepend another directory. Keep outputs under {run_dir}. Pass {coverage_db} and {coverage_name} through the project runner for shared coverage; complete native coverage setup in the next child stage."
          - "Include {wave_dir} in every imported runner and connect it to real waveform generation. Inspect existing compile/debug requirements and runtime dump controls. Output only the primary {wave_dir}/waves.vcd directly, without VPD or conversion steps. Record actual format, tool and any unverified prerequisites in runner.description; do not claim generation was verified without an authorized run."
        checker:
          - name: runnable_cards
            clss: flowcanvas.case_import_workflow.CaseImportChecker
            args: {mode: runners}
      - name: configure_shared_coverage
        desc: 配置共享覆盖数据库与面板提取
        task:
          - "Use FlowCanvas's native VCS provider for VCS projects; do not write project-specific URG parsers, extraction scripts or extract/build shell commands. The platform owns native extraction and database monitoring. Runners only write {coverage_db} with unique {coverage_name}; normal runs use output/flowcanvas/coverage/database/coverage.vdb and coverage smoke uses a private database."
          - "Enable native line, toggle and functional coverage through the existing build flow. If design metadata lives in a separate compile database, copy or symlink it at output/flowcanvas/coverage/database/compile.vdb, preserving its matching compiled design. Configure output/flowcanvas/coverage/config.json as {provider: vcs, dut_instance: actual native DUT hierarchy, urg_executable: installed URG path when not on PATH}. Top module and RTL files come from the existing FlowCanvas project configuration."
          - "Write output/flowcanvas/coverage/build.json as {inputs: [project-relative compiled binary and compiled design-metadata paths]}. Include all real compiled inputs needed to detect a rebuild; never include runtime testdata or derive identity solely from current source. The platform calculates build identity and rejects mixing builds until accumulated coverage is cleared."
          - "Inspect and reuse unchanged declarative output/flowcanvas/coverage/targets.json mappings without rewriting; add only missing mappings or repair evidenced stale entries. Each entry has target_id, selector={type, optional instance, optional point, optional bin}, file (project-relative coverage definition), sha256 of its compiled source, and frozen binding_fingerprints. Use native Source File metadata and exact instance selectors; never infer elaborated type suffixes as source declarations. Ignored/default excluded bins are marked excluded=true on the selector and are not fabricated hits. Do not change RTL or test checks to fit a mapping."
          - "Only when shared configuration is missing or actually changed, call test_case_runs configure with latest revision and coverage={provider: vcs, tool: vcs-urg, description: actual collection setup}. No database path, extract_command, merge_command or build_id_command is needed. The platform validates and refreshes line/toggle details and functional card observations. Test the real chain in the complete coverage smoke stage; static setup alone cannot finish import. For non-VCS tools retain their explicit supported provider integration rather than pretending their format is VCS."
        checker:
          - name: coverage_configuration
            clss: flowcanvas.case_import_workflow.CaseImportChecker
            args: {mode: coverage}
    checker:
      - name: imported_configuration
        clss: flowcanvas.case_import_workflow.CaseImportChecker
        args: {mode: coverage}
  - name: validate_coverage_smoke
    desc: 复核冒烟凭证，缺失或失效时验证
    task:
      - "First find and validate an existing completed coverage-smoke receipt with the current smoke/reference cases, commands, source fingerprints, compiled build and coverage configuration. Record its IDs in case-import.json and skip creating/updating cases and launching tests when it remains valid. Otherwise create or repair one dedicated short smoke case through test_cases. Reuse an imported case's actual build path, runner template, DUT fixture, environment and instrumentation; reduce only scenario length using supported project parameters or a small derived sequence. Do not replace the simulator, mock the DUT, bypass real checks, disable coverage or fake readiness/output."
      - "Register a readable smoke card with source bindings and copy its reference card's runner unchanged (only {case} selects the new short scenario). Record smoke_case_id, smoke_reference_case_id and include the new ID in card_ids. Add smoke source files to files. Reuse an existing matching smoke card when re-importing. Prepare the matching compiled build and coverage mappings before launch."
      - "Call test_case_runs(start,case_id=smoke_case_id,mode=coverage_smoke,ready_pattern=actual_test_execution_pattern,startup_timeout=120). The deadline covers the entire simulation; raise up to 600 only when required. Shorten the dedicated scenario instead of truncating execution or running every imported case. Save run.id as smoke_run_id in case-import.json."
      - "Read logs until the run ends. Require natural exit code 0, no framework errors, smoke_status=passed and coverage_status=validated, waveform_status=validated and a waveform_receipt for waveforms/waves.vcd. The runner invokes the project's configured extractor on a private native database and requires measured line coverage plus functional observations bound to panel IDs. Zero hits are valid; missing data or extraction failures are not. The primary VCD must have real signals, readable values and advancing timestamps; missing, empty or malformed output fails smoke acceptance. The formal cumulative database and panels remain unchanged."
      - "If execution or extraction fails, repair the evidenced setup and rerun only this smoke. Do not accept a startup-only receipt, kill-after-ready, fabricated report, or old artifact. This validates one representative build/run path, not every imported case or all functional coverage goals."
    checker:
      - name: coverage_smoke_receipt
        clss: flowcanvas.case_import_workflow.CaseImportChecker
        args: {mode: smoke}
  - name: reconcile_testcase_import
    desc: 核对导入与覆盖率冒烟结果
    task:
      - "This stage is a read-only review of existing evidence. Do not start tests, run startup checks for imported cases, or repeat a passed smoke. If the dedicated smoke receipt is invalid, return to validate_coverage_smoke and repair only that smoke. Inspect the final cards, commands, source bindings and smoke logs. All imported cards need valid commands and focused scenario bindings. Verify the source list explains the entry and concrete sequence without attaching shared verification infrastructure; return to import_testcase_cards if bindings are too broad. The dedicated smoke needs a current completed coverage receipt; changes to its command, source or coverage configuration require a new smoke."
      - "Report separate added, repaired and unchanged case counts, exclusions and whether the current representative smoke was reused or newly executed. No changes is a successful synchronization result. Explicitly state that the remaining imported cases were not executed. Explain unresolved issues. Complete and Exit only after final acceptance."
    checker:
      - name: final_coverage_configuration
        clss: flowcanvas.case_import_workflow.CaseImportChecker
        args: {mode: coverage}
      - name: final_alignment
        clss: flowcanvas.case_import_workflow.CaseImportChecker
        args: {mode: smoke}
