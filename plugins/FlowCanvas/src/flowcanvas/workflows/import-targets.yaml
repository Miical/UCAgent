# Synchronize existing source-backed coverage targets without running simulations.
template: null
guide_doc:
  enable: false
skill:
  use_skill: false
  general_skill_list: []
mission:
  name: 同步验证目标
  prompt:
    system: |
      Synchronize verification targets in the current FlowCanvas project {PROJECT_ROOT}.
      This workflow is repeatable: inspect existing targets and actual coverage declarations first.
      Match by stable binding markers and declaration identity/owner, never by Chinese title alone.
      Reuse existing IDs and parents; allocate only genuinely missing definitions. Unchanged healthy
      targets are read-only: do not begin_modify, rewrite titles/descriptions/explanations, rebind,
      regenerate markers or bump their state. A no-op synchronization must not write target data.
      Repair only actual source changes, broken bindings or concrete metadata/hierarchy errors, using
      the smallest update and preserving all unaffected content and bindings. Record each changed
      existing target in import-scope.json repairs as {id,reason} with concrete source evidence.
      Preserve unrelated targets and never automatically delete targets whose source disappeared;
      report them as unresolved. Do not take over transactions owned by another conversation.
      The selected DUT is {DUT}. Inspect its verification entrypoints, file lists and shared dependencies.
      Import only the user's selected module scope, not unrelated library verification environments.
      Import ONLY existing SystemVerilog covergroup, coverpoint, cross and explicit normal bins.
      Never create targets from property/assert/cover property, scoreboard comparisons, sequences,
      Python classes/functions/asserts, RTL branches or document-only plans. These may be supporting
      source context for a real coverage declaration, but are never independent imported targets.
      Each imported target requires a definition-role binding starting at its actual coverage declaration.
      Use concise readable Chinese card titles and descriptions. Prefer existing verification documents
      and test plans; cross-check them against code. Without documents, derive text from real source.
      Report differences between plans and implementation. Never fabricate coverage hits or passing tests.
      Use verification_targets inspect to read instructions, current cards, and raw source.
      Read inspect's explanation_guide and explanation_schema. For imported points and testpoints,
      populate explanation with the feature's meaning and verification approach, or the test point's
      trigger conditions, expected behavior and actual checking mechanism. Cite real source excerpts;
      mark inference and coverage-only sampling explicitly. Groups remain organizational containers.
      Follow each target through the real call/data flow and bind all relevant declaration, stimulus,
      constraints, sampling, assertion/scoreboard and necessary configuration fragments across files.
      Use definition/stimulus/check/coverage/configuration/rtl roles as appropriate; do not bind unrelated
      code or invent missing mechanisms. Preserve existing bindings when replacing the complete list.
      Save bindings first, inspect their final source lines, then update explanation using the same
      owned transaction. Only link existing test cases with evidence; do not invent relationships.
      The server generates source_hashes. Missing evidence stays unknown rather than fabricated.
      New cards use apply(count), then begin_modify(ids,action=update), update(cards) and end_modify(ids).
      Existing cards skip apply. All writes use the latest expected_revision. Preserve original IDs and
      resume interrupted operations; avoid duplicate records. update carries kind/name/description/parent
      and bindings using file/line/line_count/role; existing markers use id instead of line. Do not edit management JSON directly.
      Do not run simulations, compile a DUT, create test cases, or rewrite verification behavior.
      Binding marker comments may be added by the tool. Shared coverage definitions MUST be split,
      never excluded merely because multiple objects instantiate the same class or covergroup.
      Make a distinct independent copy per actual verification instance (for example CPU, memory,
      MMIO), using unique class/type/include-guard names and separate target/binding IDs. Update
      includes/filelists, factory creation types and config_db wiring so each instance uses its own
      copied coverage implementation. Do not use inheritance that still shares the original coverage
      declaration. Do not duplicate existing marker IDs when copying; keep original IDs only for
      the retained original definition and allocate new markers for copies. Preserve sampling,
      signals, timing, constraints and checking behavior; never modify DUT RTL to satisfy import.
      Reinspect the resulting instance-to-source wiring and register all copies. Repeated sync reuses
      these copies instead of copying again. Record the original file, instance paths, copy files and
      concrete wiring changes in instance_splits in import-scope.json. Infrastructure source edits
      needed for this split are authorized. Use the current conversation's native project editing
      tools for project source changes; workflow EditTextFile remains confined to its own output
      workspace. Do not compile or run simulations in this phase.
      If wiring cannot be determined from source, report a concrete blocker and fail acceptance;
      never claim success by excluding reused definitions or creating no targets.
      Store only a compact import scope in {OUT}/import-scope.json; plans and descriptions belong on cards.
      Continue through all stages using SetCurrentStageJournal and Complete, then Exit after acceptance.
    tips:
      always: []
      random: []
tools:
  selected_tools: [ReadTextFile, EditTextFile, CurrentTips, Status, SetCurrentStageJournal, Complete, Exit]
write_dirs: ["{OUT}"]
stage:
  - name: inspect_verification_scope
    desc: 确认验证源码与文档范围
    task:
      - "Read project verification entrypoints, build file lists and relevant verification documents. Follow necessary includes, but exclude unrelated DUTs, tools, logs and build products."
      - "Use verification_targets inspect(files) to read raw source with no syntax parser; identify only covergroup/coverpoint/cross/normal-bin declaration ranges yourself. Write {OUT}/import-scope.json with files (project-relative verification sources), documents (existing reference documents, or []), card_ids (initially []), repairs (initially []), instance_splits (initially []), and exclusions (initially []). No README is required."
    output_files: ["{OUT}/import-scope.json"]
    checker:
      - name: scope
        clss: flowcanvas.target_import_workflow.TargetImportChecker
        args: {final: false}
  - name: import_verification_cards
    desc: 核对已有目标并补齐缺失定义
    task:
      - "Read existing cards and reuse matching source bindings. Map covergroup to group, coverpoint/cross to point, explicit normal bins to testpoint; exclude ignore/illegal bins and do not invent implicit combinations. Do not import assertions, scoreboards, sequences or Python checks as targets."
      - "Reference the verified documentation when writing concise Chinese titles and descriptions; otherwise explain source intent plainly. Include sampling/trigger and expected checking behavior when the code supports it. Do not duplicate one behavior just because it appears in a document and in code."
      - "Import in manageable batches using the five target operations. Select complete source ranges with a definition-role binding beginning at the actual covergroup, labeled coverpoint/cross or normal bins declaration, starting at a source line and spanning line_count lines; the tool inserts a stable marker before the range. Record all synchronized IDs in card_ids, including unchanged reused targets and parent cards. Reused healthy targets require no write transaction. An empty card_ids is valid only when the scoped source contains no eligible coverage declarations; reused declarations must first be split and imported. Allocate only required IDs, assign types and parent links with update, bind actual implementation positions, and end each completed batch. Preserve unrelated existing cards."
      - "Never exclude reused or shared coverage declarations. Split independent copies for each real instance and import them. For genuinely unrelated helpers or non-target source, add an exclusions entry {file,reason} to import-scope.json with a concrete explanation. Never hide a required target just to pass acceptance. Unimplemented document plans are reported separately, not represented as implemented cards."
    checker:
      - name: imported_cards
        clss: flowcanvas.target_import_workflow.TargetImportChecker
        args: {final: true}
  - name: reconcile_import
    desc: 核对面板与源码一致性
    task:
      - "Inspect the final cards and source scope again. Confirm titles/descriptions match documents and code, parent links reflect the verification hierarchy, and every imported card is ready and bound. Review source completeness and semantic parent relationships yourself; range checks do not prove syntax completeness. Explain all exclusions and unresolved documentation-only plans."
      - "Report separate added, repaired and unchanged counts, source range and unresolved issues. No changes is a successful result; do not create extra targets to demonstrate progress. State that this workflow has not run verification or imported coverage results. Finish with Complete and Exit; do not repeat import or simulation to produce a report."
    checker:
      - name: final_alignment
        clss: flowcanvas.target_import_workflow.TargetImportChecker
        args: {final: true}
