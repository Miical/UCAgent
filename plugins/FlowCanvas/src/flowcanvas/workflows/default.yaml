# Retain native stages and checkers; the host adds only this panel overlay.
template_overwrite:
  PROJECT_ROOT: '{WORKSPACE}'
flowcanvas_panel:
  instruction: |
    FlowCanvas is authoritative for verification plans, FG/FC/CK targets and test-case plans.
    Call verification_targets operation=inspect and test_cases operation=inspect before maintaining project {PROJECT_ROOT}.
    When native tasks or skills ask to write the verification plan or functions-and-checks
    document, update the corresponding panel cards instead. Check generates both compatibility
    documents from the panel; do not maintain a separate plan in those documents.
    Maintain {OUT}/flowcanvas-target-map.json as a flat full FG/FC/CK path -> stable target ID
    map covering every project target, with the same hierarchy.
    For verification targets use only inspect/apply/begin_modify/update/end_modify. Allocate new
    IDs with apply, register owned modifications with begin_modify(action=update), update card
    information and complete binding lists, then end_modify. Use begin_modify(action=delete)
    and end_modify for deletion. All operations accept batches and all writes use current revision.
    For test_cases use the same five-operation lifecycle, with explicit name/title/description and definition line bindings.
    Preserve native stages, skills, batch arguments, simulations and failure analysis.
    Source binding never substitutes for native verification evidence.
  planning: |
    Put scope, risks, strategy and expected behavior in initial group card descriptions.
    Finish planned targets with planned=true; refine their children in native FG/FC/CK stages.
    If README is absent, inspect RTL and package interfaces, distinguish implementation-derived
    assumptions from requirements, and continue unless a necessary requirement remains unknown.
  implementation: |
    Keep native checked code in {OUT}/tests. Publish its complete Python source tree, preserving
    paths and imports, to {PROJECT_ROOT}/verification/default/{DUT}/tests; publish the compiled
    DUT package beside tests at {PROJECT_ROOT}/verification/default/{DUT}/{DUT}.
    Synchronize every change without overwriting unrelated files.
    Use verification_targets update(cards[].bindings) to bind each original target to its own definition/check/coverage node in the published
    {DUT}_function_coverage_def.py. Inspect and reconcile changed bindings before accepting them.
  cases: |
    Plan every new test as a test_cases card before implementation: readable title, scenario,
    expected result and target references in its description. Keep native naming, fixtures,
    mark_function, templates, batch implementation and actual test execution unchanged.
    Register every native pytest test once, including API/environment/static/random tests,
    with a definition binding to its published function. Finish all creation/update operations.
    Delete obsolete records through the tool lifecycle.
    Set each test card runner with standalone "{case}" (an absolute pytest entry), the published
    tests directory as cwd, and its parent on PYTHONPATH for DUT imports. Keep reports under
    {run_dir}. Configure real coverage extraction using the shared FlowCanvas report format,
    through test_case_runs configure, following test_cases inspect instructions. Configuration alone does not prove successful collection.
    Final acceptance requires every card ready and bound, exactly one card per native test,
    and published Python sources identical to the native checked implementation.
