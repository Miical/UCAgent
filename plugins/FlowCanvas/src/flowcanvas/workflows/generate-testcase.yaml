# Incremental single-case authoring using native UCAgent conventions.
template: null
guide_doc:
  enable: true
skill:
  use_skill: false
  general_skill_list: []
mission:
  name: 新增测试用例
  prompt:
    system: |
      为 FlowCanvas 当前项目新增一个真实、可独立运行的测试用例。项目根目录为 {PROJECT_ROOT}，顶层为 {DUT}；工作流隔离目录仅保存阶段记录，测试及共享环境代码写入项目。
      遵循 Guide_Doc/dut_test_case.md、dut_fixture.md、dut_api_instruction.md、dut_function_coverage_def.md 的接口与覆盖关联规范。
      本流程按单个场景增量建设：优先复用项目已有的测试目录、运行命令、API、dut/env fixture、Bundle、参考模型和覆盖模型；只补齐该场景需要的缺口，不要求先实现完整环境、全部API或全部功能覆盖；但当前用例的行覆盖率与功能覆盖率采集链路都必须配置完成。
      不修改 RTL，不伪造 DUT、fc_cover 或预期值，不为适配错误结果削弱断言。规格缺失时依据实际设计分析，区分实现事实和待确认需求，不把可疑 RTL 自动当成正确规格。
      编写代码前先 test_cases(inspect/apply/begin_modify) 登记占位，始终复用该 ID；不通过 import 重复登记。修改既有卡片及绑定先 begin_modify，结束后 end_modify；创建中沿用原 ID，暂停后 begin_modify。
      FlowCanvas 新生成的构建产物放在 output/flowcanvas/build，运行产物统一放在 output/flowcanvas/test-runs/<run_id>；复用已有构建时不迁移用户原有编译输入。运行命令使用 {wave_dir}，平台预先创建该目录，实际位置为 {run_dir}/waveforms。将 {wave_dir}/waves.vcd 传入真实仿真器或 fixture 并直接输出这一份 VCD，明确开启真实的波形记录开关，覆盖脚本默认关闭设置，指定 DUT 层级，并核对编译调试前提；不生成中间 VPD，不增加转换步骤，不只建目录或传未使用参数。波形页自动打开该文件，不要求用户选择。保留仿真退出状态，报告缺失输出，不复用历史文件；不为验证配置而运行仿真。
      默认不运行 DUT 仿真、pytest 收集、回归或动态 Bug 取证。静态检查不导入项目模块；不为检查而启动仿真。确需运行验证时交由用户后续点击运行测试用例。
      每阶段使用 SetCurrentStageJournal 和 Complete 推进，直到最终验收；完成只表示代码编写、静态检查及登记完成，不能宣称用例通过或覆盖命中。结束调用 Exit。
    tips:
      always: []
      random: []
tools:
  selected_tools: [ReadTextFile, EditTextFile, CurrentTips, Status, SetCurrentStageJournal, Complete, Exit]
write_dirs: ["{OUT}"]
stage:
  - name: select_and_reserve_testcase
    desc: 选择场景并登记用例
    task:
      - "读取 test_cases 的 inspect 和 verification_targets 的 inspect；检查已有用例、真实源码和运行入口，选定本次唯一场景，明确输入、预期依据、断言与拟关联的测试点，不重复已有用例。"
      - "调查现有目录和接口，列出复用文件与最小缺口。存在完整环境时直接复用；只有 RTL 时也可继续，不以缺少 README 或完整环境阻塞整个流程。"
      - "先 test_cases(apply,count=1) 申请 ID，再 begin_modify 登记并用 update 填写中文 title、代码 name 和 description，再编写代码。保存 {OUT}/testcase_plan.json：case_id 为返回 ID，target_ids 为实际拟关联的测试点 ID 数组，files 为本次将修改或新增的项目相对源码路径数组。不得填旧用例 ID。"
      - "暂缺目标时可先留空 target_ids，后续只创建本场景必要的功能组、功能点和测试点及对应覆盖定义，不要求规划整个项目。"
    reference_files: ["Guide_Doc/dut_test_case.md"]
    output_files: ["{OUT}/testcase_plan.json"]
    checker:
      - name: reserved_case
        clss: flowcanvas.testcase_authoring.TestcaseAuthoringChecker
        args: {mode: reserved}
  - name: implement_case_and_dependencies
    desc: 编写用例并按需完善环境
    task:
      - "围绕已登记场景编写测试及必要依赖，允许在用例、API和 fixture 之间迭代，不先搭建一整套与本场景无关的环境。已有驱动和采样机制作为共享契约；确有缺陷时依据源码定位最小修复，不替换为 fake DUT 或删除覆盖关联。"
      - "遵循原生普通定向用例规范：文件 test_{DUT}_<feature>.py，函数 test_<scenario>(env, ...)，通过 from {DUT}_api import * 导入接口及 fixtures。参考模型是否启用依据项目 .ucagent/runtime_config.json 中已解析的 runtime_options，不拿本工作流隔离目录的配置代替项目配置；存在配置时按配置使用 env/ref_model 参数顺序，不从环境变量自行推断。未配置参考模型时不强制搭建，用独立可解释的预期与真实断言完成场景。"
      - "尽量调用现有 api_{DUT}_*；确需新接口时仅补本场景所需函数，首参 env、末参 max_cycles 有默认值，按原生规范推进 DUT Step。缺少 dut/env fixture 时按指南补充真实 DUT 创建、必要时钟/复位、资源清理和覆盖采样。缺 Bundle、Mock 或参考模型时仅在场景确实需要时增加。"
      - "缺少编译产物且本场景需要时，可复用 Picker 编译工作流生成真实 DUT 包；复用已有包时核对来源与顶层，不重复运行全量规划工作流。"
      - "测试函数开头使用真实 fc_cover 的 mark_function，将本函数对象与实际 FG/FC/CK 关联；关联的每个测试点都须有真实激励和断言。复用已有覆盖模型，只补缺失定义并接入现有采样，不在测试里伪造 fc_cover。覆盖定义写入验证目标面板，先 inspect 原始源码，再通过 begin_modify/update/end_modify 以 file/line/line_count 绑定。"
      - "每个用例通过 test_cases(update) 设置自己的 runner={command,description}，按实际目录和入口填写；可以参考已有用例命令，使用独立的 {case} 参数（运行器会解析为绝对源码路径::测试入口），不能再拼接目录前缀；可以切换工作目录满足项目导入需要，不替换已有可用模板。补齐 testcase_plan.json 中的真实 target_ids 与 files。"
      - |
        Verilator / Toffee 默认模板（在项目现有 fixture 内增量接入，不重写整套环境）：
        ```python
        import hashlib
        import os
        import ucagent
        from pathlib import Path
        from toffee_test.reporter import set_func_coverage, set_line_coverage

        def coverage_file(request, dut):
            root = Path(os.environ["FLOWCANVAS_RUN_DIR"]) / "raw"
            key = hashlib.sha256(request.node.nodeid.encode()).hexdigest()[:16]
            folder = root / key
            folder.mkdir(parents=True, exist_ok=True)
            suffix = ucagent.get_default_subfix(dut, "coverage")
            return str(folder / ("coverage." + suffix))

        # 在真实 DUT 创建后、首次 Step 之前：
        # dut.SetCoverage(coverage_file(request, dut))
        # 若 GetCovMetrics 可用，核对其 line 位已启用；关闭时修复编译配置，不填 unavailable。
        # 保留现有 group.sample / StepRis 采样，以及 dut.fc_cover。

        # fixture finally 中，保证异常时仍清理：
        # try:
        #     set_func_coverage(request, groups)
        #     set_line_coverage(request, coverage_file(request, dut), dut=dut)
        # finally:
        #     dut.Finish()
        ```
        FlowCanvas 提供 FLOWCANVAS_RUN_DIR。DUT Finish 后生成的 .dat 放在本次运行的 raw/，原生 Toffee JSON 放在 toffee/；不要写回共享编译目录或直接修改累计目录。
      - "行覆盖率需真实编译开关、DUT SetCoverage/Finish 及 set_line_coverage 上报；功能覆盖率需真实采样、mark_function 和 set_func_coverage。复用已有机制，禁止以覆盖标记代替采样或报告。"
      - "为卡片 runner.command 配置 {wave_dir}，接通真实 VCD 输出开关。核对编译时调试访问能力、运行时输出开关及路径；在 runner.description 中说明未实测前提，不自动运行 DUT。"
      - "Picker / Toffee 运行输出隔离到 {run_dir}。开启 pytest 的 --toffee-report --report-dump-json --report-dir {run_dir}/toffee，或由已有入口传入等效选项。将 Verilator 覆盖数据库写到 {run_dir}/raw；Toffee 自己创建报表子目录。FlowCanvas 在运行前计算真实构建指纹，运行结束后发布原始产物到 output/flowcanvas/coverage/database/toffee/<run_id>/；面板读取并合并同一构建。"
      - "Picker / Toffee 用 test_case_runs(operation=configure, settings={coverage:{provider:toffee,tool:verilator-toffee,description:实际环境说明}}, expected_revision=当前版本) 注册原生后端。使用固定的 verification/coverage/flowcanvas-map.json 保存 FG/FC/CK 完整标签路径到测试点 ID 的映射，用 verification/coverage/build-inputs.json 列出 RTL、实际编译产物、覆盖定义和采样相关共享源码，不包含普通新增用例。不生成提取、合并或构建标识命令。复用已有正确的 VCS / 其他后端设置时，使用 normalized 作为计划 adapter，保留现有运行与采集约定。"
      - "testcase_plan.json 的 coverage_plan 必须记录 adapter、line_source、functional_source、mapping_file、build_inputs_file、collector_files，且 line_enabled 与 functional_enabled 都为 true。对于原生 Toffee，adapter=toffee，line_source 和 functional_source 固定为 {run_dir}/raw 与 {run_dir}/toffee，mapping_file 与 build_inputs_file 使用上述固定路径。创建只检查采集链路是否配置，真实 DUT 行覆盖以运行后的原始计数为准。"
      - "通过 test_cases(update/inspect/update) 更新同一占位 ID，绑定测试函数，保留 creating 状态供下一阶段审查；同步新增或修改目标的源码绑定。源码绑定只保留用例强相关的完整片段：definition 绑定可运行入口，stimulus 绑定该场景实际使用的 sequence/virtual sequence；场景独有且理解用例不可缺少的约束、辅助任务或预期检查可补充绑定。为理解调用链而读取共享代码，不等于需要绑定；不默认关联共享 monitor、driver、sequencer、agent、env、基类、通用记分板、覆盖采集、fixture、RTL 或构建运行脚本，不为了填满角色而扩展范围。仅在确有不可替代的场景专属逻辑时绑定其最小完整片段并说明理由。保留强相关的既有绑定，去掉当前用例过宽的基础设施绑定，不修改其他用例或共享源码。"
    reference_files: ["{OUT}/testcase_plan.json", "Guide_Doc/dut_test_case.md", "Guide_Doc/dut_fixture.md", "Guide_Doc/dut_api_instruction.md", "Guide_Doc/dut_function_coverage_def.md"]
    checker:
      - name: implemented_case
        clss: flowcanvas.testcase_authoring.TestcaseAuthoringChecker
        args: {mode: implemented}
  - name: review_case_contract
    desc: 核对场景、接口与覆盖关联
    task:
      - "逐项审查本用例的输入、独立预期、真实 DUT/API 调用和断言是否验证了指定场景；排除空实现、assert False 占位、无条件通过、skip/xfail，以及只标记覆盖但没有实际激励的写法。"
      - "核对 fixture 依赖链、DUT 包导入路径、时钟/复位与采样、API 超时/Step、清理、运行模板及覆盖标签均来自真实文件。核对覆盖率编译开关、采样和本次运行的原始落盘路径，确认 test_case_runs(operation=configure, settings={coverage:配置}) 已保存，报告和数据库属于当前 run_dir，构建指纹来自真实输入。确认复用接口未被破坏，所需新增环境足够支撑本场景，不要求实现无关功能。"
      - "静态解析本次所有修改的 Python 文件，不导入或运行项目模块。检查不能证明运行成功时如实记录待验证项；不要通过 pytest --collect-only 等隐式加载 DUT 的方式绕过禁止仿真。"
      - "将本场景的验证意图及必要运行说明直接维护在测试用例卡片 description 中；技术静态检查有门禁，语义正确性仍由本阶段逐项阅读代码核对。"
    reference_files: ["{OUT}/testcase_plan.json", "Guide_Doc/dut_test_case.md", "Guide_Doc/dut_fixture.md", "Guide_Doc/dut_api_instruction.md"]
    checker:
      - name: reviewed_case
        clss: flowcanvas.testcase_authoring.TestcaseAuthoringChecker
        args: {mode: implemented}
  - name: finalize_testcase
    desc: 完成源码绑定与用例登记
    task:
      - "read 重新核对同一用例的 title/name/description、真实源码绑定以及关联验证目标；代码变化导致 changed 时先阅读核对再 accept，不盲目确认。"
      - "关闭本次新增或修改的验证目标操作，保持所有相关源码绑定有效。对原占位调用 test_cases(end_modify)，使卡片转为正式用例；失败则修复并重试，不新建替代记录。"
      - "简洁报告本次场景、用例入口、复用及补齐的环境/API、源码绑定、运行命令和未验证事项。明确本次未执行 DUT 测试，后续通过运行按钮验证；不能把工作流验收说成用例通过。"
    reference_files: ["{OUT}/testcase_plan.json"]
    checker:
      - name: ready_case
        clss: flowcanvas.testcase_authoring.TestcaseAuthoringChecker
        args: {mode: ready}
