[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ucagent-flowcanvas"
version = "0.1.0"
description = "FlowCanvas visual verification workspace for UCAgent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["UCAgent", "fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
flowcanvas = "flowcanvas.server:main"

[project.entry-points."ucagent.plugins"]
flowcanvas = "flowcanvas.plugin:get_plugin"

[tool.setuptools.packages.find]
where = ["src"]
include = ["flowcanvas*"]

[tool.setuptools.package-data]
flowcanvas = ["web/*", "workflows/*.yaml", "workflow_catalog.yaml"]
