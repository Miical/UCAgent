[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ucagent-flowcanvas"
version = "0.1.0"
description = "FlowCanvas visual verification workspace for UCAgent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["UCAgent", "jsonschema>=4.18,<5", "fastapi>=0.115", "uvicorn>=0.30", "aiohttp>=3.14,<4", "httpx2>=2.16,<3", "pyslang>=11,<12", "rtl-buddy-sch==0.15.0"]

[project.scripts]
flowcanvas = "flowcanvas.server:main"

[project.entry-points."ucagent.plugins"]
flowcanvas = "flowcanvas.plugin:get_plugin"

[tool.setuptools.packages.find]
where = ["src"]
include = ["flowcanvas*"]

[tool.setuptools.package-data]
flowcanvas = ["web/*", "skills/verification-targets/*.md", "workflows/*.yaml", "workflow_catalog.yaml", "web/rtl-viewer/*", "web/rtl-viewer/assets/*"]
